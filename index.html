<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d97757">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Claude 100">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web@1.2.0/sans.css">
<title>100 خطوة لإتقان Claude</title>
<style>
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --surface-2: #faf8f5;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e6e0d6;
  --accent: #d97757;
  --accent-dark: #b85c3d;
  --accent-soft: #fbe9e2;
  --theory: #2563eb;
  --practice: #059669;
  --tip: #d97706;
  --warn: #dc2626;
  --shadow: 0 6px 24px rgba(31,41,55,0.08);
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.85;
  font-size: 17px;
  direction: rtl;
  text-align: right;
}
a { color: var(--accent-dark); text-decoration: none; }
a:hover { text-decoration: underline; }

.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 20px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.menu-btn {
  display: none; border: none; background: transparent; font-size: 22px; cursor: pointer;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.brand .logo {
  background: var(--accent); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 14px;
}
.brand .title { font-size: 18px; }
.search-box { margin-inline-start: auto; }
.search-box input {
  width: 260px; max-width: 40vw; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 10px; font-size: 15px; background: var(--surface-2);
}
.search-box input:focus { outline: none; border-color: var(--accent); background: #fff; }

.layout {
  display: grid; grid-template-columns: 320px 1fr; gap: 0; min-height: calc(100vh - 60px);
}
.sidebar {
  background: var(--surface);
  border-inline-end: 1px solid var(--border);
  padding: 16px 12px;
  overflow-y: auto;
  position: sticky; top: 60px; height: calc(100vh - 60px);
}
.sidebar-header h2 { margin: 8px 12px 12px; font-size: 16px; color: var(--muted); }
.chapter {
  margin-bottom: 6px; border-radius: 10px; overflow: hidden;
}
.chapter-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 15px;
  background: var(--surface-2); border-radius: 10px; user-select: none;
}
.chapter-header:hover { background: var(--accent-soft); }
.chapter-header .chev { transition: transform .2s; font-size: 12px; }
.chapter.open .chapter-header .chev { transform: rotate(90deg); }
.chapter-steps { display: none; padding: 6px 0 6px 8px; }
.chapter.open .chapter-steps { display: block; }
.step-link {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 2px 0;
  border-radius: 8px; cursor: pointer; font-size: 14.5px; color: var(--text);
}
.step-link:hover { background: var(--surface-2); }
.step-link.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
.step-num {
  background: var(--border); color: var(--muted); font-size: 12px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px; min-width: 30px; text-align: center;
}
.step-link.active .step-num { background: var(--accent); color: #fff; }

.content {
  padding: 32px 48px; max-width: 920px; width: 100%; margin: 0 auto;
}
.hero {
  text-align: center; padding: 40px 20px 30px;
}
.hero h1 { font-size: 40px; margin: 0 0 8px; color: var(--accent-dark); }
.hero .cover-sub { font-size: 20px; color: var(--muted); margin: 0 0 24px; }
.hero .meta { display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.pill {
  background: var(--surface); border: 1px solid var(--border); padding: 6px 14px; border-radius: 999px;
  font-size: 14px; color: var(--muted);
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px 28px; margin: 18px 0; box-shadow: var(--shadow);
}
.card h2 { margin-top: 0; font-size: 22px; }
.card h3 { margin-top: 0; font-size: 18px; }

.step-view .step-header {
  display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;
}
.step-badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px;
}
.badge.chapter { background: var(--accent-soft); color: var(--accent-dark); }
.badge.step { background: #eef2ff; color: #4338ca; }
.step-title { font-size: 30px; margin: 4px 0 0; color: var(--accent-dark); line-height: 1.3; }
.step-subtitle { font-size: 17px; color: var(--muted); margin: 0; }

.section {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px 26px; margin: 16px 0; box-shadow: var(--shadow);
  border-inline-start: 5px solid var(--accent);
}
.section.theory { border-inline-start-color: var(--theory); }
.section.practice { border-inline-start-color: var(--practice); }
.section.tip { border-inline-start-color: var(--tip); }
.section.mistake { border-inline-start-color: var(--warn); }
.section h3 {
  display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 19px;
}
.section .icon { font-size: 20px; }
.section p { margin: 0 0 10px; }
.section ol, .section ul { margin: 0 0 10px; padding-inline-start: 22px; }
.section li { margin: 4px 0; }

.nav-buttons {
  display: flex; justify-content: space-between; gap: 12px; margin-top: 28px;
}
.nav-buttons button {
  flex: 1; padding: 12px 16px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--text);
}
.nav-buttons button:hover { border-color: var(--accent); color: var(--accent-dark); }
.nav-buttons button:disabled { opacity: .4; cursor: default; }

.toc-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 16px;
}
.toc-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
  cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.toc-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.toc-card h4 { margin: 0 0 4px; color: var(--accent-dark); }
.toc-card p { margin: 0; color: var(--muted); font-size: 14px; }

.intro-text { white-space: pre-line; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }

@media (max-width: 820px) {
  .menu-btn { display: block; }
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: 60px; right: 0; z-index: 40;
    width: 300px; transform: translateX(100%); transition: transform .25s;
    height: calc(100vh - 60px);
  }
  html[dir="rtl"] .sidebar { transform: translateX(100%); }
  .sidebar.open { transform: translateX(0); }
  .content { padding: 24px 18px; }
  .search-box input { width: 160px; }
}
.overlay {
  display: none; position: fixed; inset: 60px 0 0 0; background: rgba(0,0,0,.3); z-index: 35;
}
.overlay.show { display: block; }
</style>
</head>
<body>
<div class="topbar">
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="brand">
    <img src="logo.webp" alt="Claude" class="logo-img" style="height:32px;width:auto;vertical-align:middle;">
  </div>
  <div class="search-box">
    <input id="search" type="search" placeholder="ابحث في 100 خطوة...">
  </div>
  <a href="quiz.html" style="background:var(--accent);color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;text-decoration:none;font-size:14px;">اختبار</a>
</div>
<div class="overlay" id="overlay"></div>
<div id="updateBanner" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent-dark);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);z-index:60;font-weight:700;">
  إصدار جاهز للتحديث
  <button onclick="location.reload()" style="margin-inline-start:12px;background:#fff;color:var(--accent-dark);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:700;">تحديث الآن</button>
</div>
<div id="installBanner" style="display:none;position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);z-index:60;font-weight:700;max-width:320px;">
  يمكنك تثبيت الموقع كتطبيق على هاتفك
  <button id="installBtn" style="margin-inline-start:12px;background:#fff;color:var(--accent-dark);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:700;">تثبيت</button>
  <button onclick="document.getElementById('installBanner').style.display='none'" style="margin-inline-start:8px;background:transparent;color:#fff;border:none;padding:6px 8px;cursor:pointer;font-size:16px;">×</button>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>المحتويات</h2></div>
    <nav id="nav"></nav>
  </aside>
  <main class="content" id="content"></main>
</div>

<script>
const STEPS = JSON.parse(document.getElementById('steps-data').textContent);
const INTRO = "— همدختسن له ةلأسملا دعت مل ،ةيمويلا انتايح نم ًاءزج يعانطصالا ءاكذلا هيف راص يذلا نمزلا يف\n.ناقتإب همدختسن فيك لب\nةعّزوم ةوطخ 100 نم نّوكم سوردم جهنم وه .ةرباع ليح ةعومجم الو ،ًاعيرس ًاليلد سيل باتكلا اذه\nيتلا ةظحللا ىتح ،Claude اهيف حتفت يتلا ىلوألا ةظحللا نم كذخأي جّردتم بيترتب تينُب ،لوصف 10 ىلع\nنم فرتحم مدختسمك ريكفتلاو ،ةلماكتم ةمظنأ ءانبو ،لماك لمع ريس ةتمتأ ىلع ًارداق اهيف حبصُت\n.ةبخنلا\n.ةراهم ىلإ مهفلا مجرتُي يلمع قيبطتو ،كمهف قّمعُي يرظن ساسأ :نيتزيكر ىلع يوتحت ةوطخ لك\nعئاش أطخ نم ريذحتو ،ناديملا ةربخ نم ةحيصنو ،prompt ىلع زهاج لاثم اهبحاصي تاوطخلا نم ريثك\n.كريغ ريثك هيف عقو\n.ًامامت رخآ ملاع يف كسفن دجتس ،قدصب ةوطخ 100 تقّبط اذإ .لقتنا مث ،قّبط ،ةوطخ أرقا .لجعتست ال\n؟باتكلا اذه مدختست فيك\n• .هلبق ام ىلع ينبي لصف لك — ةرم لوأ بيترتلاب لصفلا أرقا\n• .يروف قيبطت + ةءارق :لقألا ىلع ةقيقد 30–15 ةوطخ لكل صّصخ\n• .اهدعب قيبطتلا نم قمعأ ةءارقلا تقو قيبطتلا .ةءارقلا ءانثأ كبناجب Claude حتفا\n• .ةوطخ لك نم هتمّلعت ام هيف لّجس (يقرو وأ يمقر) تاظحالم رتفدب ظفتحا\n• .ًالعف هتنقتأ ام ىلع ةمالع عضو هتاوطخل عجرا ،لصف ءاهنإ دعب\n• .قباسلا لصفلا تاوطخ نم %80 قيبطت لبق ديدج لصفل لقتنت ال\n• .ةرم لك يف ةيطخ ةءارق ةرورضلاب سيل — عجرمك باتكلل عجرا\n«ةزجعم ةادأ يأب عنصي فرتحملا نكل ،فرتحملا عنصت ال ةادألا»";
const CHAPTERS = [{"num": 1, "title": "تايساسألا", "count": 10}, {"num": 2, "title": "Prompts ـلا ةغايص", "count": 10}, {"num": 3, "title": "Artifacts ـلا", "count": 10}, {"num": 4, "title": "Skills ـلا", "count": 10}, {"num": 5, "title": "لمع ليمزك Claude", "count": 10}, {"num": 6, "title": "(Connectors) تالِّصوملا", "count": 10}, {"num": 7, "title": "(Automation) ةتمتألا", "count": 10}, {"num": 8, "title": "Claude Code", "count": 10}, {"num": 9, "title": "ةمدقتملا مادختسالا تالاح", "count": 10}, {"num": 10, "title": "قراخلا مدختسملا", "count": 10}];
const THEORY_LABEL = "يرظنلا ساسألا";
const PRACTICE_LABEL = "يلمعلا قيبطتلا";
const TIP_LABEL = "ةيفارتحا ةحيصن";
const MISTAKE_LABEL = "عئاش أطخ :رذحا";

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatBlock(text) {
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  let html = '';
  let inOl = false, inUl = false;
  const closeLists = () => {
    if (inOl) { html += '</ol>'; inOl = false; }
    if (inUl) { html += '</ul>'; inUl = false; }
  };
  for (const line of lines) {
    const olMatch = line.match(/^(\d+)[\.\)]\s*(.*)$/);
    const olMatch2 = line.match(/^(.*\D)(\d+)\.$/);
    const isBullet = line.startsWith('•') || line.startsWith('-') || line.startsWith('*');
    if (olMatch) {
      if (inUl) { html += '</ul>'; inUl = false; }
      if (!inOl) { html += '<ol>'; inOl = true; }
      html += '<li>' + esc(olMatch[2]) + '</li>';
    } else if (olMatch2 && parseInt(olMatch2[2],10) <= 20) {
      if (inUl) { html += '</ul>'; inUl = false; }
      if (!inOl) { html += '<ol>'; inOl = true; }
      html += '<li>' + esc(olMatch2[1]) + '</li>';
    } else if (isBullet) {
      if (inOl) { html += '</ol>'; inOl = false; }
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += '<li>' + esc(line.replace(/^[•\-*]\s*/, '')) + '</li>';
    } else {
      closeLists();
      html += '<p>' + esc(line) + '</p>';
    }
  }
  closeLists();
  return html;
}

const state = { current: null, search: '' };

function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const term = state.search.trim().toLowerCase();
  CHAPTERS.forEach(ch => {
    const chSteps = STEPS.filter(s => s.chapter === ch.num);
    const filtered = term ? chSteps.filter(s =>
      (s.title + ' ' + s.subtitle + ' ' + s.theory + ' ' + s.practical).toLowerCase().includes(term)
    ) : chSteps;
    if (term && filtered.length === 0) return;
    const div = document.createElement('div');
    div.className = 'chapter' + (state.current && state.current.chapter === ch.num ? ' open' : '');
    const header = document.createElement('div');
    header.className = 'chapter-header';
    header.innerHTML = '<span>' + esc(ch.title) + '</span><span class="chev">▸</span> <span style="color:var(--muted);font-size:12px;margin-inline-start:6px;">' + filtered.length + '</span>';
    header.onclick = () => div.classList.toggle('open');
    div.appendChild(header);
    const stepsDiv = document.createElement('div');
    stepsDiv.className = 'chapter-steps';
    filtered.forEach(s => {
      const a = document.createElement('div');
      a.className = 'step-link' + (state.current && state.current.number === s.number ? ' active' : '');
      a.innerHTML = '<span class="step-num">' + String(s.number).padStart(2,'0') + '</span><span>' + esc(s.title) + '</span>';
      a.onclick = () => showStep(s.number);
      stepsDiv.appendChild(a);
    });
    div.appendChild(stepsDiv);
    nav.appendChild(div);
  });
  // auto open chapter of current
  if (state.current) {
    document.querySelectorAll('.chapter').forEach(c => {
      // no-op
    });
  }
}

function showHome() {
  state.current = null;
  const content = document.getElementById('content');
  let toc = '';
  CHAPTERS.forEach(ch => {
    toc += '<div class="toc-card" onclick="showChapter(' + ch.num + ')"><h4>' + esc(ch.title) + '</h4><p>' + ch.count + ' خطوات</p></div>';
  });
  content.innerHTML = `
    <section class="hero">
      <h1>100 خطوة لإتقان Claude</h1>
      <p class="cover-sub">لماكتملا ملعتلا ليلد</p>
      <div class="meta">
        <span class="pill">100 خطوة</span>
        <span class="pill">10 فصول</span>
        <span class="pill">2026 • الإصدار العربي</span>
      </div>
      <div style="margin-top:24px;">
        <button onclick="showStep(1)" style="background:var(--accent);color:#fff;border:none;padding:12px 28px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;">ابدأ من الخطوة 1 ←</button>
      </div>
    </section>
    <section class="card">
      <h2>مقدمة</h2>
      <div class="intro-text">${esc(INTRO)}</div>
    </section>
    <section>
      <h2 style="text-align:center;margin:30px 0 10px;">فهرس المحتويات</h2>
      <div class="toc-grid">${toc}</div>
    </section>
  `;
  buildNav();
  location.hash = '';
}

function showChapter(num) {
  const first = STEPS.find(s => s.chapter === num);
  if (first) showStep(first.number);
}

function showStep(num) {
  const s = STEPS.find(x => x.number === num);
  if (!s) return;
  state.current = s;
  location.hash = 'step-' + num;
  const content = document.getElementById('content');
  let sections = '';
  sections += '<div class="section theory"><h3><span class="icon">📘</span> ' + THEORY_LABEL + '</h3>' + formatBlock(s.theory) + '</div>';
  sections += '<div class="section practice"><h3><span class="icon">🛠️</span> ' + PRACTICE_LABEL + '</h3>' + formatBlock(s.practical) + '</div>';
  if (s.protip) sections += '<div class="section tip"><h3><span class="icon">💡</span> ' + TIP_LABEL + '</h3>' + formatBlock(s.protip) + '</div>';
  if (s.mistake) sections += '<div class="section mistake"><h3><span class="icon">⚠️</span> ' + MISTAKE_LABEL + '</h3>' + formatBlock(s.mistake) + '</div>';

  const prev = STEPS.find(x => x.number === num - 1);
  const next = STEPS.find(x => x.number === num + 1);
  content.innerHTML = `
    <div class="step-view">
      <div class="step-header">
        <div class="step-badge-row">
          <span class="badge chapter">${esc(s.chapter_title)}</span>
          <span class="badge step">الخطوة ${s.number} من 100</span>
        </div>
        <h1 class="step-title">${esc(s.title)}</h1>
        <p class="step-subtitle">${esc(s.subtitle)}</p>
      </div>
      ${sections}
      <div class="nav-buttons">
        <button ${prev ? '' : 'disabled'} onclick="showStep(${prev ? prev.number : 0})">${prev ? '← السابق: ' + esc(prev.title) : '—'}</button>
        <button ${next ? '' : 'disabled'} onclick="showStep(${next ? next.number : 0})">${next ? 'التالي: ' + esc(next.title) + ' →' : '—'}</button>
      </div>
    </div>
  `;
  buildNav();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showChapter(num) {
  const first = STEPS.find(s => s.chapter === num);
  if (first) showStep(first.number);
}

// routing
function handleRoute() {
  const hash = location.hash.replace('#', '');
  const m = hash.match(/^step-(\d+)$/);
  if (m) showStep(parseInt(m[1], 10));
  else showHome();
}

window.addEventListener('hashchange', handleRoute);

// search
document.getElementById('search').addEventListener('input', (e) => {
  state.search = e.target.value;
  buildNav();
});

// menu
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
menuBtn.addEventListener('click', () => {
  sidebar.classList.toggle('open'); overlay.classList.toggle('show');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('open'); overlay.classList.remove('show');
});

// init
handleRoute();

// Install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const b = document.getElementById('installBanner');
  if (b) b.style.display = 'block';
});
const installBtn = document.getElementById('installBtn');
if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    const b = document.getElementById('installBanner');
    if (b) b.style.display = 'none';
  });
}
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const b = document.getElementById('installBanner');
  if (b) b.style.display = 'none';
});

// Mobile fallback: show manual install instructions if auto-prompt not available
setTimeout(() => {
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  if (isMobile && !deferredPrompt) {
    const b = document.getElementById('installBanner');
    if (b) {
      b.innerHTML = 'للتثبيت: افتح قائمة المتصفح (⋮) ثم "إضافة إلى الشاشة الرئيسية"';
      b.style.display = 'block';
    }
  }
}, 2000);

// Service Worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          document.getElementById('updateBanner').style.display = 'block';
        }
      });
    });
  }).catch(() => {});
}
</script>
</body>
</html>
