:root {
  --bg: #f6f3ee;

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: 'Thmanyah Sans', 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.85; font-size: 17px;
}
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 20px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);

}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }

.hero p { color: var(--muted); margin: 0; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px 28px; margin: 18px 0; box-shadow: var(--shadow);
}
.qnum { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.qtext { font-size: 20px; font-weight: 700; margin: 0 0 16px; color: var(--accent-dark); }
.options { list-style: none; padding: 0; margin: 0; }
.options li {
  padding: 12px 16px; margin: 8px 0; border: 1px solid var(--border); border-radius: 12px;
  cursor: pointer; transition: all .15s; background: var(--surface);
}
.options li:hover { border-color: var(--accent); background: var(--accent-soft); }
.options li.selected { border-color: var(--accent); background: var(--accent-soft); }
.options li.correct { border-color: var(--correct); background: #ecfdf5; color: var(--correct); font-weight: 700; }
.options li.wrong { border-color: var(--wrong); background: #fef2f2; color: var(--wrong); }
.ref { margin-top: 12px; font-size: 14px; color: var(--muted); border-inline-start: 3px solid var(--border); padding-inline-start: 10px; }
.actions { display: flex; gap: 12px; margin-top: 20px; }
.actions button {
  flex: 1; padding: 12px 16px; border: none; border-radius: 12px; cursor: pointer;
  font-size: 15px; font-weight: 700; color: #fff; background: var(--accent);
}
.actions button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.actions button:disabled { opacity: .5; cursor: default; }
.score-box {
  text-align: center; padding: 24px; background: var(--accent-soft); border-radius: var(--radius);
  margin: 20px 0; border: 1px solid var(--border);
}
.score-box h2 { margin: 0 0 8px; color: var(--accent-dark); }
.progress { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin: 12px 0 20px; }
.progress > div { height: 100%; background: var(--accent); transition: width .3s; }

<script>
const QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);
let current = 0;
let score = 0;
let answered = false;
let userAnswers = [];

function render() {
  const area = document.getElementById('quizArea');
  const scoreArea = document.getElementById('scoreArea');
  if (current >= QUESTIONS.length) {
    showScore();
    return;
  }
  scoreArea.style.display = 'none';
  const q = QUESTIONS[current];
  let opts = '';
  q.options.forEach((o, i) => {
    opts += '<li data-idx="' + i + '">' + escapeHtml(o) + '</li>';
  });
  area.innerHTML = `
    <div class="card">
      <div class="qnum">السؤال ${current + 1} من ${QUESTIONS.length}</div>
      <p class="qtext">${escapeHtml(q.q)}</p>
      <ul class="options" id="opts">${opts}</ul>
      <div class="ref" id="ref" style="display:none;">${escapeHtml(q.ref)}</div>
      <div class="actions">
        <button id="checkBtn" disabled>تحقق</button>
        <button id="nextBtn" class="secondary" disabled>التالي →</button>
      </div>
    </div>
  `;
  document.getElementById('progressBar').style.width = ((current) / QUESTIONS.length * 100) + '%';
  let selected = null;
  document.querySelectorAll('#opts li').forEach(li => {
    li.addEventListener('click', () => {
      if (answered) return;
      document.querySelectorAll('#opts li').forEach(x => x.classList.remove('selected'));
      li.classList.add('selected');
      selected = parseInt(li.dataset.idx, 10);
      document.getElementById('checkBtn').disabled = false;
    });
  });
  document.getElementById('checkBtn').addEventListener('click', () => {
    if (selected === null || answered) return;
    answered = true;
    const q = QUESTIONS[current];
    userAnswers.push(selected);
    document.querySelectorAll('#opts li').forEach((li, i) => {
      if (i === q.answer) li.classList.add('correct');
      else if (i === selected) li.classList.add('wrong');
    });
    if (selected === q.answer) score++;
    document.getElementById('ref').style.display = 'block';
    document.getElementById('checkBtn').disabled = true;
    document.getElementById('nextBtn').disabled = false;
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    answered = false;
    current++;
    render();
  });
}

function showScore() {
  const area = document.getElementById('quizArea');
  const scoreArea = document.getElementById('scoreArea');
  area.innerHTML = '';
  scoreArea.style.display = 'block';
  const pct = Math.round(score / QUESTIONS.length * 100);
  scoreArea.innerHTML = `
    <div class="score-box">
      <h2>نتيجتك: ${score} / ${QUESTIONS.length}</h2>
      <p>${pct}% — ${pct >= 80 ? 'ممتاز!' : pct >= 60 ? 'جيد' : 'يحتاج مراجعة'}</p>
      <div class="actions" style="justify-content:center;">
        <button onclick="restart()">إعادة الاختبار</button>
        <button class="secondary" onclick="window.location.href='index.html'">العودة للموقع</button>
      </div>
    </div>
  `;
  document.getElementById('progressBar').style.width = '100%';
}

function restart() {
  current = 0; score = 0; answered = false; userAnswers = [];
  document.getElementById('scoreArea').style.display = 'none';
  render();
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

render();

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const b = document.getElementById('installBanner');
  if (b) b.style.display = 'block';
});
const installBtn = document.getElementById('installBtn');
if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    const b = document.getElementById('installBanner');
    if (b) b.style.display = 'none';
  });
}
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const b = document.getElementById('installBanner');
  if (b) b.style.display = 'none';
});

setTimeout(() => {
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  if (isMobile && !deferredPrompt) {
    const b = document.getElementById('installBanner');
    if (b) {
      b.innerHTML = 'للتثبيت: افتح قائمة المتصفح (⋮) ثم "إضافة إلى الشاشة الرئيسية"';
      b.style.display = 'block';
    }
  }
}, 2000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          document.getElementById('updateBanner').style.display = 'block';
        }
      });
    });
  }).catch(() => {});
}
</script>
</body>
</html>
